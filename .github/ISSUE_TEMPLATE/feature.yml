name: Feature / Implementation Task
description: A clearly scoped business need. Issues without acceptance criteria will not be assigned to Copilot agents.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the desired outcome in business terms.
      placeholder: "Students need a way to cancel an activity sign-up after they change their mind."
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current Behaviour
      description: What happens today? Keep it user-focused, with a short technical reference if helpful.
      placeholder: "There is no way for a student to remove themselves from an activity once they have signed up."
    validations:
      required: true

  - type: textarea
    id: criteria
    attributes:
      label: Acceptance Criteria
      description: Numbered list. Each item must be independently verifiable by a BA, QA, or developer.
      placeholder: |
        1. A student can cancel their sign-up for an activity
        2. The system shows a clear message when cancellation succeeds
        3. The system shows a clear message when the activity does not exist or the student was not signed up
        4. A pytest test covers the cancel-sign-up path
        5. All existing tests pass
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Technical Context
      description: Keep this short. Give the exact file and function name so the agent can act quickly.
      placeholder: |
        - File: src/app.py — follow the pattern of signup_for_activity()
        - Frontend: src/static/app.js if the screen also needs a button
        - Constraint: keep the change in-memory and avoid adding new libraries
    validations:
      required: true
