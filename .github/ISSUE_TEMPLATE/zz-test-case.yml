name: Test Case / Validation Task
description: A clear testing gap to close. Keep the issue business-first and include the smallest technical anchor needed.
title: "[Test]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the test coverage gap in business terms.
      placeholder: "We need tests that confirm students cannot register twice for the same activity."
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current Behaviour
      description: What is not covered today? Keep it short.
      placeholder: "There is no automated test for duplicate signups, so the bug can come back unnoticed."
    validations:
      required: true

  - type: textarea
    id: criteria
    attributes:
      label: Acceptance Criteria
      description: Numbered list. Each item must be independently verifiable by a BA, QA, or developer.
      placeholder: |
        1. A pytest test covers the target behavior
        2. The test fails before the fix and passes after the fix
        3. Existing tests continue to pass
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Technical Context
      description: Keep this short. Give the exact file and test focus so the agent can act quickly.
      placeholder: |
        - File: tests/test_app.py
        - Behavior: duplicate signup prevention or max participant limit
        - Constraint: use TestClient and the in-memory store
    validations:
      required: true