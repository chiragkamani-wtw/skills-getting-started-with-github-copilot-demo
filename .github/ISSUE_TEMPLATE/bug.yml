name: Bug Report
description: A reproducible business problem to fix. Issues without reproduction steps will not be assigned to Copilot agents.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Describe the business problem in plain language. One or two sentences.
      placeholder: "A student can be added to an activity even after the activity is full."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact UI or API steps that trigger the defect.
      placeholder: |
        1. Open the activity sign-up screen or call the signup endpoint for Chess Club
        2. Sign up students until the activity reaches its limit
        3. Try one more sign-up
        4. The extra student is still accepted instead of being blocked
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      placeholder: "The system should prevent the extra signup and show a clear message such as 'Activity is full'."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: Paste the actual result, response, or message that was shown.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Technical Context
      description: Keep this short. Give the exact file and function name so the agent can jump to the right place.
      placeholder: |
        - File: src/app.py — function signup_for_activity()
        - Business rule: do not allow sign-up after the activity is full
        - Test: add a pytest test for the full-capacity scenario
    validations:
      required: true

  - type: textarea
    id: criteria
    attributes:
      label: Acceptance Criteria
      description: Numbered list. Each item must be independently verifiable by a BA, QA, or developer.
      placeholder: |
        1. Users cannot sign up once the activity is full
        2. Users see a clear message when sign-up is blocked
        3. A pytest test covers the full-capacity scenario
        4. All existing tests pass
    validations:
      required: true
