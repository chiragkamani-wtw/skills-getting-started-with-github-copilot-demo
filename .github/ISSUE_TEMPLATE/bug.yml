name: Bug Report
description: A reproducible business problem to fix. Keep the description business-first and the technical context short.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Describe the business problem in plain language. One or two sentences.
      placeholder: "Students can keep signing up for an activity even after it is full."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Simple user steps or API steps that show the problem.
      placeholder: |
        1. Open the activity sign-up page or submit the signup request for Chess Club
        2. Sign up enough students to reach the activity limit
        3. Try one more signup
        4. The extra student is accepted instead of being blocked
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      placeholder: "The system should block the extra signup and show a clear message like 'Activity is full'."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: Paste the actual result, response, or message that was shown.
      placeholder: "The extra student is added and the activity goes over capacity."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Technical Context
      description: Keep this short. Give only the minimum technical anchor the agent needs.
      placeholder: |
        - File: src/app.py — function signup_for_activity()
        - Business rule: do not allow sign-up after the activity is full
        - Test: cover the full-capacity scenario in pytest
    validations:
      required: true

  - type: textarea
    id: criteria
    attributes:
      label: Acceptance Criteria
      description: Numbered list. Each item must be independently verifiable by a BA, QA, or developer.
      placeholder: |
        1. Users cannot sign up once the activity is full
        2. Users see a clear message when sign-up is blocked
        3. A pytest test covers the full-capacity scenario
        4. All existing tests pass
    validations:
      required: true
