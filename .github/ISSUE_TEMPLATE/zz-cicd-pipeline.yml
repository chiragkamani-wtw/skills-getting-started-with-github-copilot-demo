name: CI/CD Pipeline Task
description: A workflow automation need for tests or delivery. Keep the issue business-first and the technical anchor short.
title: "[CI/CD]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the delivery or automation outcome in business terms.
      placeholder: "We need an automated pipeline to run tests before code is merged."
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current Behaviour
      description: What happens today without the pipeline?
      placeholder: "Changes can be merged without automatically validating the app or tests."
    validations:
      required: true

  - type: textarea
    id: criteria
    attributes:
      label: Acceptance Criteria
      description: Numbered list. Each item must be independently verifiable by a BA, QA, or developer.
      placeholder: |
        1. A GitHub Actions workflow runs on pull requests
        2. The workflow installs dependencies and runs pytest
        3. The workflow clearly reports failures in the repository checks
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Technical Context
      description: Keep this short. Give the minimum file/path anchor needed for implementation.
      placeholder: |
        - File: .github/workflows/<new-workflow>.yml
        - Step: install requirements and run pytest
        - Constraint: keep the pipeline simple and repository-local
    validations:
      required: true